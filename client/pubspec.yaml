name: tunnel_client
description: Windows 内网穿透客户端，通过 WebSocket 隧道把公网 HTTP/WebSocket 转发到本机服务。
publish_to: "none"
version: 1.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  path_provider: ^2.1.5
  window_manager: ^0.4.3
  tray_manager: ^0.2.4
  uuid: ^4.5.1
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tray_icon.ico
    - assets/app_icon.png
